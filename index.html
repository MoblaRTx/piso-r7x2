<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Floor"><meta name="theme-color" content="#0e0c15"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html,body{height:100%}</style></head><body><title>La Agencia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen&family=Unbounded:wght@600;800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: oficina isométrica 3D a pantalla completa; barra arriba, etiquetas flotantes, hoja de detalle que sube desde abajo. Un solo look oscuro. */
:root{
  --ink:#121019; --panel:#1b1824ee; --panel-solid:#1b1824; --line:#332d45; --text:#f4f0e8; --muted:#a39cb2;
  --amber:#ffb547; --violet:#8f80ff; --up:#3ddc97; --down:#ff6b7a; --idle:#6b6580;
  --pixel:"Silkscreen","Courier New",monospace; --display:"Unbounded","Arial Black",system-ui,sans-serif; --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace; color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--ink);color:var(--text);font-family:var(--body);overflow:hidden;-webkit-user-select:none;user-select:none}
*{box-sizing:border-box}
#escena{position:fixed;inset:0;touch-action:none}
#escena canvas{display:block}
.top{position:fixed;inset:0 0 auto;z-index:5;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;
  padding:calc(env(safe-area-inset-top,0px) + 12px) max(14px,env(safe-area-inset-right,0px)) 10px max(14px,env(safe-area-inset-left,0px));pointer-events:none}
.brand{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:6px 10px;font-family:var(--pixel);font-weight:800;font-size:12px;letter-spacing:.14em;text-transform:uppercase;line-height:1.6}
.brand b{color:var(--amber)}.brand small{display:block;font-family:var(--mono);font-weight:400;letter-spacing:0;text-transform:none;color:var(--muted);font-size:10.5px}
.kpi{pointer-events:auto;cursor:pointer;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px 12px;text-align:right;backdrop-filter:blur(8px)}
.kpi b{display:block;font-family:var(--display);font-size:18px;font-variant-numeric:tabular-nums}
.kpi span{font-family:var(--mono);font-size:11px}
.up{color:var(--up)}.down{color:var(--down)}
.nav{pointer-events:auto;cursor:pointer;margin-left:auto;align-self:center;font:600 12px var(--body);color:var(--ink);background:var(--amber);border:0;border-radius:99px;padding:9px 13px;white-space:nowrap}
.nav:focus-visible,.kpi:focus-visible{outline:2px solid var(--text);outline-offset:2px}
.boton{font:600 14px var(--body);color:var(--ink);background:var(--amber);border:0;border-radius:12px;padding:12px 16px;cursor:pointer;justify-self:start}
#etiquetas{position:fixed;inset:0;pointer-events:none;z-index:3}
.tag{position:absolute;transform:translate(-50%,-100%);white-space:nowrap;pointer-events:auto;cursor:pointer;font-family:var(--pixel)!important;border-radius:2px!important;
  font-size:11px;font-weight:600;background:#15131cdd;color:var(--text);border:1px solid #ffffff22;border-radius:99px;padding:3px 8px 3px 6px;display:flex;align-items:center;gap:5px}
.tag i{width:7px;height:7px;border-radius:50%;background:var(--idle);flex:none}
.tag i.on{background:var(--up);box-shadow:0 0 6px var(--up)}.tag i.wait{background:var(--amber)}.tag i.off{background:var(--down)}
.tag.sala{font-family:var(--mono);font-weight:600;font-size:10.5px;background:#f4f0e8;color:#15131c;border:0;padding:4px 9px;letter-spacing:.02em}
.tag.sala em{font-style:normal;background:#15131c;color:#f4f0e8;border-radius:99px;padding:0 6px;margin-left:2px}
.tag.lejos{opacity:0;pointer-events:none}
.hint{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 16px);z-index:4;
  font-family:var(--mono);font-size:11px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:7px 14px;pointer-events:none;transition:opacity .4s}
.hoja{position:fixed;left:0;right:0;bottom:0;z-index:10;max-height:72%;overflow-y:auto;background:var(--panel-solid);border-top:1px solid var(--line);
  border-radius:22px 22px 0 0;padding:10px max(18px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 22px) max(18px,env(safe-area-inset-left,0px));
  transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.8,.2,1);box-shadow:0 -20px 50px #0008}
.hoja.abierta{transform:none}
.hoja .asa{width:42px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 12px}
.hoja .cerrar{position:absolute;right:max(14px,env(safe-area-inset-right,0px));top:12px;width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--muted);font-size:16px;cursor:pointer}
.hoja .cerrar:focus-visible{outline:2px solid var(--amber)}
.hoja-in{max-width:560px;margin:0 auto;display:grid;gap:12px}
.eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.hoja h2{font-family:var(--display);font-size:22px;line-height:1.1;margin:0;text-wrap:balance;display:flex;align-items:center;gap:10px}
.hoja p{margin:0;color:var(--muted);line-height:1.5}
.big{font-family:var(--display);font-weight:800;font-size:40px;line-height:1;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--mono);font-size:11.5px;background:#25212f;border:1px solid var(--line);border-radius:99px;padding:5px 10px;color:var(--muted)}
.chip b{color:var(--text)}
.led{width:11px;height:11px;border-radius:50%;background:var(--idle);flex:none}.led.on{background:var(--up);box-shadow:0 0 8px var(--up)}.led.wait{background:var(--amber)}
.rows{display:grid;gap:6px}
.row{display:grid;grid-template-columns:62px 1fr auto;align-items:center;gap:10px;background:#221e2c;border-radius:12px;padding:8px 12px}
.sym{font-family:var(--display);font-size:13px}.sym small{display:block;font-family:var(--body);font-size:10.5px;color:var(--muted)}
.num{font-family:var(--mono);font-size:12.5px;text-align:right;font-variant-numeric:tabular-nums}
.pips{display:flex;gap:3px}.pips i{flex:1;max-width:20px;height:9px;border-radius:3px;background:#332d45}.pips i.on{background:var(--violet)}
.gauge{position:relative;height:9px;border-radius:99px;background:#332d45}
.gauge::after{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:2px;background:var(--muted)}
.gauge i{position:absolute;top:0;bottom:0;border-radius:99px}
.pill{font-family:var(--mono);font-size:10.5px;font-weight:600;padding:3px 7px;border-radius:99px;background:#332d45;color:var(--muted)}.pill.in{background:#3ddc9726;color:var(--up)}
.strat{background:#221e2c;border-radius:12px;padding:9px 12px}.strat b{display:block}.strat span{color:var(--muted);font-size:12.5px}
.chart svg{display:block;width:100%;height:auto}
.nota{font-size:11px;color:var(--muted)}
.carga{position:fixed;inset:0;display:grid;place-items:center;z-index:20;background:var(--ink);font-family:var(--mono);color:var(--muted);transition:opacity .5s}
@media (prefers-reduced-motion:reduce){.hoja{transition:none}}
</style>

<div id="escena" aria-label="Oficina del Trading Floor en 3D. Toca a una persona o sala para ver sus datos."></div>
<div id="etiquetas"></div>
<header class="top">
  <div class="brand">La <b>Agencia</b><small id="stamp">abriendo…</small></div>
  <button class="nav" id="nav" type="button">📈 Entrar a Trading</button>
  <button class="kpi" id="kpi" type="button"><b id="kpiValor">—</b><span id="kpiDelta">demo</span></button>
</header>
<div class="hint" id="hint">Toca a cualquiera · arrastra para moverte</div>
<section class="hoja" id="hoja" aria-live="polite"><div class="asa"></div><button class="cerrar" id="cerrar" type="button" aria-label="Cerrar">✕</button><div class="hoja-in" id="hojaIn"></div></section>
<div class="carga" id="carga">Abriendo la oficina…</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pct = v => (v >= 0 ? "+" : "") + v.toFixed(1) + "%";
const QUIETO = false;  // Romano quiere ver a todos moverse aunque Windows tenga las animaciones apagadas

/* ---------- gráfico (SVG) ---------- */
function grafico(h) {
  if (!h || h.length < 2) return "";
  const W = 560, H = 190, L = 6, R = 6, T = 22, B = 24, base = 0;  // h[].p = % desde el inicio (la web no muestra montos)
  const vals = h.map(d => d.p).concat(base);
  let lo = Math.min(...vals), hi = Math.max(...vals); const pad = Math.max((hi - lo) * .2, .25); lo -= pad; hi += pad;
  const x = i => L + i * (W - L - R) / (h.length - 1), y = v => T + (hi - v) * (H - T - B) / (hi - lo);
  const pts = h.map((d, i) => `${x(i).toFixed(1)},${y(d.p).toFixed(1)}`).join(" ");
  const u = h[h.length - 1], col = u.p >= base ? "#3ddc97" : "#ff6b7a";
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Valor de la demo por día">
  <defs><linearGradient id="gg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".35"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>
  <line x1="${L}" x2="${W - R}" y1="${y(base)}" y2="${y(base)}" stroke="#a39cb2" stroke-dasharray="4 5" opacity=".6"/>
  <text x="${W - R}" y="${y(base) - 6}" text-anchor="end" fill="#a39cb2" font-family="JetBrains Mono,monospace" font-size="12">0% inicio</text>
  <polygon points="${x(0)},${H - B} ${pts} ${x(h.length - 1)},${H - B}" fill="url(#gg)"/>
  <polyline points="${pts}" fill="none" stroke="${col}" stroke-width="3" stroke-linejoin="round"/>
  ${h.map((d, i) => d.o ? `<circle cx="${x(i)}" cy="${y(d.p)}" r="3.5" fill="#ffb547"/>` : "").join("")}
  <circle cx="${x(h.length - 1)}" cy="${y(u.p)}" r="5.5" fill="${col}" stroke="#1b1824" stroke-width="3"/>
  <text x="${L}" y="${H - 6}" fill="#a39cb2" font-family="JetBrains Mono,monospace" font-size="12">${esc(h[0].f.slice(5))}</text>
  <text x="${W - R}" y="${H - 6}" text-anchor="end" fill="#a39cb2" font-family="JetBrains Mono,monospace" font-size="12">${esc(u.f.slice(5))}</text></svg>`;
}

/* ---------- hoja de detalle ---------- */
let D = null;
function abrir(tipo, extra) {
  const d = D, dm = d.demo, up = dm.ganancia_pct >= 0;
  const cripto = d.activos.filter(a => a.tipo === "cripto"), etfs = d.activos.filter(a => a.tipo === "etf");
  const bot = t => d.bots.find(b => b.tipo === t) || {};
  const led = s => s === "live" ? "on" : s === "pausa" ? "wait" : "";
  const etapa = k => d.laboratorio.filter(s => s.etapa === k);
  const lista = arr => arr.length ? arr.map(s => `<div class="strat"><b>${esc(s.nombre)}</b><span>${esc(s.dato)}</span></div>`).join("") : `<p>Vacío por ahora.</p>`;
  const rev = new Date(dm.revision + "T12:00:00").toLocaleDateString("es", {day: "numeric", month: "long"});
  const ficha = a => `<div class="chips"><span class="chip">Modelo <b>${esc(a.modelo || "—")}</b></span>${a.agente ? `<span class="chip">Carpeta <b>agentes/${esc(a.agente)}</b></span>` : ""}<span class="chip">Reporta a <b>Jarvis Trading</b></span></div>`;
  let h = "";
  if (tipo === "cuenta") h = `<span class="eyebrow">Pantalla de recepción · cuenta demo</span>
    <div><div class="big ${up ? "up" : "down"}">${pct(dm.ganancia_pct)}</div><span style="font-family:var(--mono)">desde el inicio</span></div>
    <div class="chart">${grafico(d.historial)}</div>
    <div class="chips"><span class="chip">Día <b>${Math.min(dm.dias, dm.dias_prueba)}</b> de ${dm.dias_prueba}</span><span class="chip">Revisión <b>${esc(rev)}</b></span>
    <span class="chip">Efectivo <b>${Math.round(dm.efectivo_pct)}%</b></span><span class="chip">Órdenes hoy <b>${dm.ordenes_hoy}</b></span></div>
    <span class="nota">Dinero de mentira. Puntos amarillos = días con compras o ventas.</span>`;
  if (tipo === "cripto") { const b = bot("cripto"); h = `<span class="eyebrow">Sala de bots · cripto</span>
    <h2><span class="led ${led(b.estado)}"></span>${esc(b.nombre)}</h2>${ficha(b)}<p>${esc(b.regla)} Hoy <b style="color:var(--text)">${cripto.filter(a => a.peso > 0).length} de ${cripto.length}</b> monedas adentro.</p>
    <div class="rows">${cripto.map(a => `<div class="row"><span class="sym">${esc(a.sim)}</span><span class="pips" title="${a.votos} de 6 votos">${[0,1,2,3,4,5].map(k => `<i class="${k < a.votos ? "on" : ""}"></i>`).join("")}</span><span class="num ${a.peso > 0 ? "up" : ""}">${a.peso.toFixed(1)}%</span></div>`).join("")}</div>
    <span class="nota">Barras moradas = votos a favor (de 6). Número = parte de la cuenta.</span>`; }
  if (tipo === "etf") { const b = bot("etf"); h = `<span class="eyebrow">Sala de bots · fondos</span>
    <h2><span class="led ${led(b.estado)}"></span>${esc(b.nombre)}</h2>${ficha(b)}<p>${esc(b.regla)} Hoy <b style="color:var(--text)">${etfs.filter(a => a.dentro).length} de ${etfs.length}</b> fondos adentro.</p>
    <div class="rows">${etfs.map(a => { const c = Math.max(-10, Math.min(10, a.dist)), w = Math.abs(c) * 5;
      return `<div class="row"><span class="sym">${esc(a.sim)}<small>${esc(a.nombre)}</small></span><span class="gauge"><i style="${c >= 0 ? `left:50%;width:${w}%;background:var(--up)` : `right:50%;width:${w}%;background:var(--down)`}"></i></span><span class="pill ${a.dentro ? "in" : ""}">${a.dentro ? "DENTRO" : "FUERA"}</span></div>`; }).join("")}</div>
    <span class="nota">La raya del medio es la línea de 150 días. Verde a la derecha = sobre la línea.</span>`; }
  if (tipo === "ia") { const a = d.ias[extra] || {}; h = a.estado === "prueba"
    ? `<span class="eyebrow">Sala de IAs · en prueba</span><h2><span class="led on"></span>${esc(a.nombre)}</h2>${ficha(a)}<p>${esc(a.idea)}</p>${(a.reporte || []).length ? `<div class="rows">${a.reporte.map(l => `<div class="strat"><span>${esc(l)}</span></div>`).join("")}</div>` : ""}<span class="nota">A los 30 días el laboratorio compara su opinión contra los bots.</span>`
    : `<span class="eyebrow">Sala de IAs · escritorio libre</span><h2><span class="led"></span>${esc(a.nombre)}</h2>${ficha(a)}<p>${esc(a.idea)}</p><p>Cuando la contratemos, compite contra los bots con dinero de mentira. Si gana, pasa por el laboratorio como cualquiera.</p>`; }
  if (tipo === "etapa") { const nombres = {backtest: "Backtest · examen con el pasado", live: "Live test · 30 días en demo", real: "Dinero real · bóveda", rechazada: "Descartadas"};
    const arr = extra === "backtest" ? etapa("cola").concat(etapa("reserva"), etapa("backtest")) : etapa(extra);
    h = `<span class="eyebrow">Laboratorio</span><h2>${esc(nombres[extra])}</h2>
    ${extra === "real" ? `<p>Nadie entra aquí sin 30 días buenos en demo y tu ✅ Aprobar.</p>` : ""}
    <div class="rows">${lista(arr)}</div>`; }
  if (tipo === "estrategia") h = `<span class="eyebrow">Laboratorio · ${esc(extra.etapa)}</span><h2>${esc(extra.nombre)}</h2><p>${esc(extra.dato)}</p>`;
  if (tipo === "con") { const c = d.conexiones[extra] || {}, t = {ok: ["on", "Conectado"], espera: ["wait", "Esperando"], pendiente: ["", "Por conectar"]}[c.estado] || ["", c.estado];
    h = `<span class="eyebrow">Recepción · conexiones</span><h2><span class="led ${t[0]}"></span>${esc(c.nombre)}</h2><p><b style="color:var(--text)">${t[1]}.</b> ${esc(c.que)}</p>`; }
  if (tipo === "claude") { const j = d.jefe || {}; h = `<span class="eyebrow">Gerencia · jefe del piso</span><h2><span class="led on"></span>${esc(j.nombre || "Jarvis Trading")}</h2>
    <div class="chips"><span class="chip">Modelo <b>${esc(j.modelo || "Opus")}</b></span><span class="chip">Reporta a <b>Jarvis Central</b></span></div>
    <p>${esc(j.tarea || "")}</p><p>No mueve dinero real. Eso pasa solo con tu ✅.</p>`; }
  if (tipo === "central") { const c = d.campus || [], aten = c.filter(p => p.te_necesita);
    h = `<span class="eyebrow">Campus · torre central</span><h2><span class="led on"></span>Jarvis Central</h2>
    <div class="chips"><span class="chip">Modelo <b>Opus</b></span><span class="chip">Carpeta <b>Jarvis-Central</b></span><span class="chip">Le reportan <b>${c.length} áreas</b></span></div>
    <p>Ve el cuadro completo, junta el parte del día de cada Jarvis y te dice qué necesita de ti. No toca correos ni dinero de nadie.</p>
    <span class="eyebrow">Te necesitan</span>
    <div class="rows">${aten.length ? aten.map(p => `<div class="strat"><b>${esc(p.nombre)}</b><span>Tiene pendientes para ti · el detalle está en tu chat con Jarvis Central</span></div>`).join("") : "<p>Nada pendiente. 🎉</p>"}</div>`; }
  if (tipo === "area") { const p = extra, t = {ok: ["on", "Todo bien"], atencion: ["wait", "Necesita atención"], parado: ["off", "Parado"], construccion: ["wait", "En construcción 🚧"]}[p.estado] || ["", p.estado];
    h = `<span class="eyebrow">Campus · ${esc(p.nombre)}</span><h2><span class="led ${t[0]}"></span>${esc(p.jefe)}</h2>
    <div class="chips"><span class="chip">Modelo <b>${esc(p.modelo)}</b></span><span class="chip">Estado <b>${t[1]}</b></span><span class="chip">Reporta a <b>Jarvis Central</b></span></div>
    <p>${esc(p.publico)}</p>${p.te_necesita ? `<div class="strat"><b>Te necesita</b><span>Tiene pendientes para ti · el detalle está en tu chat con Jarvis Central</span></div>` : ""}
    <span class="nota">Parte del día · ${esc(p.actualizado)}</span>
    ${(p.oficina && p.oficina.hoy || []).length ? `<span class="eyebrow">Hoy</span><div class="rows">${p.oficina.hoy.map(l => `<div class="strat"><span>${esc(l)}</span></div>`).join("")}</div>` : ""}
    ${(p.oficina && p.oficina.pendientes || []).length ? `<span class="eyebrow">Lo que sigue</span><div class="rows">${p.oficina.pendientes.map(l => `<div class="strat"><span>${esc(l)}</span></div>`).join("")}</div>` : ""}
    ${CENTROS && CENTROS[p.area] && ZONA !== p.area ? `<button class="boton" type="button" onclick="irA('${p.area}')">Entrar a la oficina →</button>` : ""}`; }
  if (tipo === "lab") { const a = d.agente_lab || {}; h = `<span class="eyebrow">Laboratorio · agente</span><h2><span class="led on"></span>${esc(a.nombre)}</h2>${ficha(a)}
    <p>${esc(a.tarea || "")}</p>${(a.reporte || []).length ? `<div class="rows">${a.reporte.map(l => `<div class="strat"><span>${esc(l)}</span></div>`).join("")}</div>` : `<p>Sin pruebas nuevas hoy. En cola: ${esc((d.laboratorio.find(s => s.etapa === "cola") || {}).nombre || "nada")}.</p>`}`; }
  $("#hojaIn").innerHTML = h; $("#hoja").classList.add("abierta");
}
$("#cerrar").onclick = () => $("#hoja").classList.remove("abierta");
$("#kpi").onclick = () => D && abrir("cuenta");

/* ---------- la oficina ---------- */
function render(d) {
  if (!d) { $("#carga").textContent = "Todavía no hay datos. Llegan con la señal de las 9 AM."; return; }
  D = d;
  const dm = d.demo, up = dm.ganancia_pct >= 0;
  $("#kpiValor").textContent = pct(dm.ganancia_pct);
  $("#kpiValor").className = up ? "up" : "down";
  $("#kpiDelta").textContent = `demo · día ${Math.min(dm.dias, dm.dias_prueba)}/${dm.dias_prueba}`;
  $("#stamp").textContent = "act. " + d.actualizado.slice(5);
  if (!window.THREE) { $("#carga").textContent = "No se pudo cargar el 3D. Revisa tu conexión."; return; }
  construir(d);
  $("#carga").style.opacity = 0; setTimeout(() => $("#carga").remove(), 600);
  setTimeout(() => $("#hint").style.opacity = 0, 6000);
  if (location.protocol.startsWith("http")) { pulso(); setInterval(pulso, 60000); }
}

/* ---------- en vivo: vivo.json lo escribe un robot de GitHub cada 15 min ---------- */
let VIVO = null, refrescarTele = () => {};
let ZONA = "campus", construyendo = "trading", CENTROS = null, irA = () => {};
async function pulso() {
  try {
    const r = await fetch("vivo.json?t=" + Date.now(), {cache: "no-store"}); if (!r.ok) return;
    const v = await r.json();
    if (v.ganancia_pct == null || (VIVO && VIVO.hora === v.hora)) return;
    VIVO = v; D.demo.ganancia_pct = v.ganancia_pct;
    const hoy = v.hora.slice(0, 10), h = D.historial, u = h[h.length - 1];
    if (u && u.f === hoy) u.p = v.ganancia_pct; else h.push({f: hoy, p: v.ganancia_pct, o: 0});
    $("#kpiValor").textContent = pct(v.ganancia_pct);
    $("#kpiValor").className = v.ganancia_pct >= 0 ? "up" : "down";
    $("#stamp").textContent = "● en vivo · " + new Date(v.hora).toLocaleTimeString("es", {hour: "numeric", minute: "2-digit"});
    refrescarTele();
  } catch (e) { /* sin internet: se queda con lo último */ }
}

function construir(d) {
  const cont = $("#escena");
  const renderer = new THREE.WebGLRenderer({antialias: true});
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.outputEncoding = THREE.sRGBEncoding;
  cont.appendChild(renderer.domElement);
  const scene = new THREE.Scene(); scene.background = new THREE.Color("#8ec9ff");

  const cam = new THREE.OrthographicCamera(-1, 1, 1, -1, -200, 400);
  const target = new THREE.Vector3(0, 0, 0);
  // en vertical (celular) la cámara mira más desde arriba para que la oficina ocupe más alto
  const dir = new THREE.Vector3(1, innerWidth < innerHeight ? 1.8 : 1.05, 1).normalize();
  let sol = null;
  function ubicar() {
    cam.position.copy(target).addScaledVector(dir, 80); cam.lookAt(target);
    if (sol) { sol.position.copy(target).add(new THREE.Vector3(-14, 30, 18)); sol.target.position.copy(target); }
  }
  let vista = innerWidth < 700 ? 1.15 : 1;  // en el celular arranca más cerca; se aleja pellizcando
  function tam() {
    const w = innerWidth, h = innerHeight, a = w / h;
    const alto = a < 1 ? 54 / a : 32;
    cam.left = -alto * a / 2; cam.right = alto * a / 2; cam.top = alto / 2; cam.bottom = -alto / 2;
    cam.zoom = vista; cam.updateProjectionMatrix(); renderer.setSize(w, h);
  }
  ubicar(); tam(); addEventListener("resize", tam);

  scene.add(new THREE.HemisphereLight("#ffffff", "#7a6a55", .9));
  sol = new THREE.DirectionalLight("#fff4dc", .75); sol.castShadow = true; scene.add(sol.target);
  sol.shadow.mapSize.set(2048, 2048); Object.assign(sol.shadow.camera, {left: -30, right: 30, top: 30, bottom: -30, near: 1, far: 80});
  sol.shadow.bias = -.0005; scene.add(sol); ubicar();

  /* estilo bloques: todo es un cubo con textura pixelada de 16×16 (1 bloque = 1 unidad) */
  let semilla = 7; const azar = () => (semilla = (semilla * 16807) % 2147483647) / 2147483647;
  const texturas = {};
  function pixeles(c) {
    if (texturas[c]) return texturas[c];
    const cv = document.createElement("canvas"); cv.width = cv.height = 16; const g = cv.getContext("2d"), base = new THREE.Color(c);
    for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) { g.fillStyle = "#" + base.clone().multiplyScalar(.84 + azar() * .16).getHexString(); g.fillRect(x, y, 1, 1); }
    const t = new THREE.CanvasTexture(cv); t.magFilter = t.minFilter = THREE.NearestFilter; t.wrapS = t.wrapT = THREE.RepeatWrapping; t.encoding = THREE.sRGBEncoding;
    return texturas[c] = t;
  }
  function cubo(w, h, dd) {  // caja con las texturas repetidas por bloque, no estiradas
    const geo = new THREE.BoxGeometry(w, h, dd), uv = geo.attributes.uv;
    const caras = [[dd, h], [dd, h], [w, dd], [w, dd], [w, h], [w, h]];
    for (let f = 0; f < 6; f++) for (let i = 0; i < 4; i++) { const k = f * 4 + i; uv.setXY(k, uv.getX(k) * caras[f][0], uv.getY(k) * caras[f][1]); }
    return geo;
  }
  const mats = {};
  const mat = (c, o = {}) => { const k = c + JSON.stringify(o); if (mats[k]) return mats[k];
    const liso = o.transparent || o.emissive; return mats[k] = new THREE.MeshLambertMaterial(Object.assign(liso ? {color: c} : {color: "#ffffff", map: pixeles(c)},
      Object.fromEntries(Object.entries(o).filter(([q]) => !["roughness", "metalness"].includes(q))))); };
  const caja = (w, h, dd, c, x, y, z, o, padre = scene) => { const m = new THREE.Mesh(cubo(w, h, dd), mat(c, o)); m.position.set(x, y + h / 2, z); m.castShadow = m.receiveShadow = true; padre.add(m); return m; };
  const cil = (r, h, c, x, y, z, padre = scene) => caja(r * 2, h, r * 2, c, x, y, z, {}, padre);
  const esfera = (r, c, x, y, z, padre = scene, o) => { const s = r * 1.7; return caja(s, s, s, c, x, y - s / 2, z, o, padre); };
  // nubes de bloques
  const nubes = [];
  for (let i = 0; i < 14; i++) { const n = new THREE.Group(), cx = -40 + azar() * 220, cz = -30 + azar() * 60;
    const nube = {emissive: "#e8f4ff", emissiveIntensity: .5}; caja(3 + azar() * 4, .6, 2 + azar() * 2, "#ffffff", 0, 0, 0, nube, n); caja(2, .6, 1.5, "#ffffff", 1, .6, .3, nube, n);
    n.position.set(cx, 16 + azar() * 4, cz); n.traverse(o => { if (o.isMesh) o.castShadow = false; }); scene.add(n); nubes.push(n); }

  /* piso del edificio y salas */
  caja(42, .4, 30, "#7d7d7d", 0, -.4, 0);
  const salas = [
    {n: "Recepción", x0: -20, x1: -6, z0: 1, z1: 14, c: "#c9a37c"},
    {n: "Sala de Bots", x0: -6, x1: 8, z0: 1, z1: 14, c: "#4a3d8c"},
    {n: "Sala de IAs", x0: 8, x1: 20, z0: 1, z1: 14, c: "#d7dbe4"},
    {n: "Backtest", x0: -20, x1: -7, z0: -14, z1: -1, c: "#9fb4d6"},
    {n: "Live test", x0: -7, x1: 6, z0: -14, z1: -1, c: "#2f7d5c"},
    {n: "Dinero real", x0: 6, x1: 20, z0: -14, z1: -1, c: "#c9a246"},
  ];
  salas.forEach(s => caja(s.x1 - s.x0 - .1, .06, s.z1 - s.z0 - .1, s.c, (s.x0 + s.x1) / 2, 0, (s.z0 + s.z1) / 2));
  caja(40, .05, 2, "#8d8798", 0, 0, 0); // pasillo

  /* paredes: altas atrás e izquierda (corte tipo maqueta), vidrio entre salas */
  const pared = "#ece6dc", vidrio = {color: "#bfe3ff", transparent: true, opacity: .22, roughness: .1};
  caja(40.4, 3, .3, pared, 0, 0, -14.15); caja(.3, 3, 28.6, pared, -20.15, 0, 0);
  caja(40.4, .5, .3, pared, 0, 0, 14.15); caja(.3, .5, 28.6, pared, 20.15, 0, 0);
  const vid = (w, dd, x, z) => { const m = caja(w, 2.4, dd, "#bfe3ff", x, 0, z, vidrio); m.castShadow = false; caja(w, .08, dd, "#3b3550", x, 2.4, z); };
  [[-6, 1, 14], [8, 1, 14]].forEach(([x, z0, z1]) => vid(.08, z1 - z0 - 3, x, (z0 + z1) / 2 + 1.5));
  [[-7, -14, -1], [6, -14, -1]].forEach(([x, z0, z1]) => vid(.08, z1 - z0 - 3, x, (z0 + z1) / 2 - 1.5));
  // pared de vidrio hacia el pasillo, con una puerta de 2 en el medio de cada sala
  salas.forEach(s => { const z = s.z0 > 0 ? 1 : -1, m = (s.x0 + s.x1) / 2, a = m - 1 - s.x0, b = s.x1 - (m + 1);
    vid(a, .08, s.x0 + a / 2, z); vid(b, .08, m + 1 + b / 2, z); });
  // bóveda: reja dorada
  for (let i = 0; i < 9; i++) cil(.05, 2.4, "#e0b84a", 6.6 + i * 1.5, 0, -1.05, scene, 6);

  /* muebles */
  function escritorio(x, z, color = "#e9e2d6", pantalla = "#2b2f3a", padre = scene) {
    caja(2.2, .08, 1.1, color, x, .74, z, {}, padre);
    [[-1, -.45], [1, -.45], [-1, .45], [1, .45]].forEach(([a, b]) => caja(.06, .74, .06, "#3b3550", x + a, 0, z + b, {}, padre));
    caja(.9, .55, .06, "#22202a", x - .3, .82, z - .3, {}, padre);
    const p = caja(.82, .45, .02, pantalla, x - .3, .87, z - .26, {emissive: pantalla, emissiveIntensity: .9}, padre);
    caja(.5, .03, .2, "#3b3550", x + .45, .82, z + .05, {}, padre);
    return p;
  }
  function silla(x, z, c = "#2b2733") { caja(.6, .08, .6, c, x, .45, z); caja(.6, .6, .08, c, x, .5, z - .3); cil(.05, .45, "#3b3550", x, 0, z); }
  function planta(x, z, s = 1) { cil(.28 * s, .5 * s, "#d8cdbd", x, 0, z); esfera(.45 * s, "#4f9d58", x, .9 * s, z); esfera(.32 * s, "#6bbf6a", x + .2 * s, 1.25 * s, z - .1 * s); }
  function sofa(x, z, c = "#4a4458") { caja(2.4, .45, .9, c, x, 0, z); caja(2.4, .5, .25, c, x, .45, z - .35); caja(.25, .35, .9, c, x - 1.1, .45, z); caja(.25, .35, .9, c, x + 1.1, .45, z); }

  /* gente */
  const caminantes = [], flotantes = [], clicables = [];
  const caras = {};
  function cara(piel, pelo) {  // cara de 8×8 píxeles: pelo arriba, ojos, boca
    const k = piel + pelo; if (caras[k]) return caras[k];
    const cv = document.createElement("canvas"); cv.width = cv.height = 8; const g = cv.getContext("2d");
    g.fillStyle = piel; g.fillRect(0, 0, 8, 8); g.fillStyle = pelo; g.fillRect(0, 0, 8, 2); g.fillRect(0, 2, 1, 1); g.fillRect(7, 2, 1, 1);
    g.fillStyle = "#ffffff"; g.fillRect(1, 4, 2, 1); g.fillRect(5, 4, 2, 1); g.fillStyle = "#3b2a6b"; g.fillRect(2, 4, 1, 1); g.fillRect(5, 4, 1, 1);
    g.fillStyle = new THREE.Color(piel).multiplyScalar(.7).getStyle(); g.fillRect(3, 6, 2, 1);
    const t = new THREE.CanvasTexture(cv); t.magFilter = t.minFilter = THREE.NearestFilter; t.encoding = THREE.sRGBEncoding;
    return caras[k] = new THREE.MeshLambertMaterial({map: t});
  }
  const pantalones = ["#3b5ba5", "#2f3b55", "#5a4636", "#3d6b4a"];
  function persona({ropa = "#5b8def", piel = "#e8b98f", pelo = "#2a1f1a", x, z, rot = 0}) {
    const g = new THREE.Group(), pan = pantalones[Math.floor(azar() * pantalones.length)];
    // brazos y piernas cuelgan de una bisagra (cadera / hombro) para balancearse al caminar, estilo bloques
    const bisagra = (x, y) => { const b = new THREE.Group(); b.position.set(x, y, 0); g.add(b); return b; };
    const piernas = [-.12, .12].map(px => { const b = bisagra(px, .6); caja(.22, .6, .24, pan, 0, -.6, 0, {}, b); return b; });
    caja(.48, .62, .26, ropa, 0, .6, 0, {}, g);                                               // cuerpo
    const brazos = [-.35, .35].map(px => { const b = bisagra(px, 1.22);
      caja(.2, .62, .22, ropa, 0, -.62, 0, {}, b); caja(.12, .14, .2, piel, 0, -.72, 0, {}, b); return b; });  // brazo + mano
    const cabeza = new THREE.Mesh(cubo(.46, .46, .46), [mat(piel), mat(piel), mat(pelo), mat(piel), cara(piel, pelo), mat(pelo)]);
    cabeza.position.y = 1.22 + .23; cabeza.castShadow = true; g.add(cabeza);
    g.userData.cuerpo = {piernas, brazos, cabeza, fase: azar() * 6, mira: azar() * 6};
    g.position.set(x, 0, z); g.rotation.y = rot; scene.add(g); return g;
  }
  function robot({x, z, color = "#8f80ff", estado = "live"}) {
    const g = new THREE.Group();
    caja(.5, .5, .36, "#d9d6e2", 0, .1, 0, {}, g); caja(.62, .6, .42, color, 0, .55, 0, {}, g);
    caja(.48, .38, .4, "#e9e6f0", 0, 1.18, 0, {}, g);
    caja(.36, .09, .02, "#65f0ff", 0, 1.32, .21, {emissive: "#65f0ff", emissiveIntensity: 1.2}, g);
    cil(.02, .3, "#3b3550", 0, 1.56, 0, g, 6);
    const ledc = estado === "live" ? "#3ddc97" : estado === "pausa" ? "#ffb547" : "#ff6b7a";
    const led = esfera(.08, ledc, 0, 1.92, 0, g, {emissive: ledc, emissiveIntensity: 1.6});
    g.position.set(x, 0, z); scene.add(g); return {g, led};
  }

  /* etiquetas HTML */
  const etiquetas = [];
  function etiqueta(html, pos, alClick, clase = "") {
    const el = document.createElement("button"); el.type = "button"; el.className = "tag " + clase; el.innerHTML = html;
    el.onclick = e => { e.stopPropagation(); alClick && alClick(); };
    $("#etiquetas").appendChild(el); etiquetas.push({el, pos, zona: construyendo}); return el;
  }
  const marcar = (obj, fn) => obj.traverse(o => { if (o.isMesh) { o.userData.fn = fn; clicables.push(o); } });

  /* ---- Recepción ---- */
  caja(4.2, 1.1, .9, "#8a5a3b", -13, 0, 10.5); caja(4.4, .08, 1.1, "#f1ece4", -13, 1.1, 10.5);
  persona({ropa: "#f0a35e", x: -13, z: 9.6, rot: Math.PI});
  sofa(-17.5, 3.4); planta(-19.2, 13.2); planta(-7, 13.2, .9); planta(-19.2, 6, .8);
  // pantalla grande con la cuenta
  const lienzo = document.createElement("canvas"); lienzo.width = 640; lienzo.height = 360;
  const cx = lienzo.getContext("2d");
  function pintarTele() {
    cx.fillStyle = "#15131c"; cx.fillRect(0, 0, 640, 360);
    cx.fillStyle = "#a39cb2"; cx.font = "600 24px JetBrains Mono, monospace"; cx.fillText(VIVO ? "CUENTA DEMO · EN VIVO" : "CUENTA DEMO", 32, 52);
    cx.fillStyle = D.demo.ganancia_pct >= 0 ? "#3ddc97" : "#ff6b7a"; cx.font = "800 82px Unbounded, Arial Black, sans-serif"; cx.fillText(pct(D.demo.ganancia_pct), 28, 140);
    cx.font = "600 30px JetBrains Mono, monospace"; cx.fillText(`día ${Math.min(D.demo.dias, D.demo.dias_prueba)} de ${D.demo.dias_prueba}`, 32, 186);
    const hh = D.historial; if (hh.length > 1) { const vs = hh.map(q => q.p).concat(0), lo = Math.min(...vs) - .15, hi = Math.max(...vs) + .15;
      cx.strokeStyle = cx.fillStyle; cx.lineWidth = 6; cx.lineJoin = "round"; cx.beginPath();
      hh.forEach((q, i) => { const px = 32 + i * 576 / (hh.length - 1), py = 330 - (q.p - lo) / (hi - lo) * 110; i ? cx.lineTo(px, py) : cx.moveTo(px, py); }); cx.stroke(); }
    tex.needsUpdate = true;
  }
  const tex = new THREE.CanvasTexture(lienzo); tex.encoding = THREE.sRGBEncoding;
  refrescarTele = pintarTele; pintarTele();
  const tele = new THREE.Group();
  caja(4.4, 2.6, .16, "#22202a", 0, 1.2, 0, {}, tele);
  const pant = new THREE.Mesh(new THREE.PlaneGeometry(4.15, 2.33), new THREE.MeshBasicMaterial({map: tex})); pant.position.set(0, 2.5, .09); tele.add(pant);
  cil(.08, 1.2, "#3b3550", 0, 0, 0, tele); caja(1.4, .06, .8, "#3b3550", 0, 0, 0, {}, tele);
  tele.position.set(-13, 0, 5.2); tele.rotation.y = .5; scene.add(tele); marcar(tele, () => abrir("cuenta"));
  etiqueta(`<i class="on"></i>Cuenta demo`, new THREE.Vector3(-13, 4.2, 5.2), () => abrir("cuenta"), "fija");
  // kioscos de conexiones
  d.conexiones.forEach((c, i) => {
    const x = -18.2 + i * 1.9, z = 8.6, col = {ok: "#3ddc97", espera: "#ffb547"}[c.estado] || "#6b6580";
    const k = new THREE.Group(); caja(.8, 1.3, .5, "#f1ece4", 0, 0, 0, {}, k); caja(.66, .5, .04, "#22202a", 0, .7, .26, {emissive: col, emissiveIntensity: .35}, k);
    esfera(.12, col, 0, 1.5, 0, k, {emissive: col, emissiveIntensity: 1.5}); k.position.set(x, 0, z); scene.add(k);
    marcar(k, () => abrir("con", i));
    etiqueta(`<i class="${c.estado === "ok" ? "on" : c.estado === "espera" ? "wait" : ""}"></i>${esc(c.nombre.split(" ")[0])}`, new THREE.Vector3(x, 2.1, z), () => abrir("con", i));
  });

  /* ---- Sala de Bots ---- */
  const pantallaBot = (on) => on ? "#3ddc97" : "#5a5670";
  const bc = d.bots.find(b => b.tipo === "cripto") || {}, be = d.bots.find(b => b.tipo === "etf") || {};
  const criptoOn = d.activos.some(a => a.tipo === "cripto" && a.peso > 0), etfOn = d.activos.some(a => a.tipo === "etf" && a.dentro);
  escritorio(-2.5, 6.5, "#e9e2d6", pantallaBot(criptoOn)); silla(-2.5, 5.4);
  escritorio(3.5, 6.5, "#e9e2d6", pantallaBot(etfOn)); silla(3.5, 5.4);
  const r1 = robot({x: -2.5, z: 5.2, color: "#8f80ff", estado: bc.estado}), r2 = robot({x: 3.5, z: 5.2, color: "#3ddc97", estado: be.estado});
  marcar(r1.g, () => abrir("cripto")); marcar(r2.g, () => abrir("etf"));
  flotantes.push(r1.led, r2.led);
  etiqueta(`<i class="${bc.estado === "live" ? "on" : ""}"></i>${esc(bc.nombre || "Bot cripto")}`, new THREE.Vector3(-2.5, 2.6, 5.2), () => abrir("cripto"), "fija");
  etiqueta(`<i class="${be.estado === "live" ? "on" : ""}"></i>${esc(be.nombre || "Bot fondos")}`, new THREE.Vector3(3.5, 2.6, 5.2), () => abrir("etf"), "fija");
  escritorio(-2.5, 11, "#d6cfc3"); silla(-2.5, 9.9, "#3a3546"); escritorio(3.5, 11, "#d6cfc3"); silla(3.5, 9.9, "#3a3546");
  planta(7, 13.2, .9); planta(-5, 2, .7);

  /* ---- Sala de IAs ---- */
  d.ias.forEach((a, i) => {
    const x = 11 + i * 5, z = 6.5;
    escritorio(x, z, "#f4f1ea"); silla(x, z - 1.1, "#5b5670");
    const hit = caja(2.2, 2, 2, "#000", x, 0, z - .5, {transparent: true, opacity: 0}); hit.castShadow = false; marcar(hit, () => abrir("ia", i));
    if (a.estado === "prueba") {  // ya trabaja: robot sentado en su escritorio
      const r = robot({x, z: z - 1.1, color: "#f2b84b", estado: "live"}); marcar(r.g, () => abrir("ia", i)); flotantes.push(r.led);
      const t = {calma: "🟢", ojo: "🟡", alarma: "🔴"}[(d.noticias || {}).nivel] || "";
      etiqueta(`<i class="on"></i>${esc(a.nombre)} ${t}`, new THREE.Vector3(x, 2.6, z - 1.1), () => abrir("ia", i), "fija");
    } else etiqueta(`<i></i>${esc(a.nombre)} · vacante`, new THREE.Vector3(x, 2.2, z - .4), () => abrir("ia", i));
  });
  planta(19.2, 13.2); planta(9, 2, .8); sofa(14, 11.5, "#6c6680");

  /* ---- Laboratorio ---- */
  const ropas = ["#5b8def", "#f06e9c", "#ffb547", "#46c3a0", "#a78bfa", "#ef8354", "#7dd3fc"];
  const pieles = ["#e8b98f", "#c68b5e", "#f1cfae", "#8d5a3b"];
  let n = 0;
  function sembrar(lista, x0, x1, z0, z1, gris) {
    lista.forEach((s, i) => {
      const x = x0 + (i % 3 + .5) * (x1 - x0) / 3, z = z0 + (Math.floor(i / 3) + .6) * 2.6;
      const p = persona({ropa: gris ? "#77738a" : ropas[n % ropas.length], piel: pieles[n++ % pieles.length], x, z, rot: Math.random() * 6});
      if (!gris) caminantes.push({g: p, x0: x0 + .8, x1: x1 - .8, z0: z0 + .5, z1: z1 - .5, dest: null, pausa: Math.random() * 3});
      marcar(p, () => abrir("estrategia", s));
      etiqueta(`<i class="${s.etapa === "live" ? "on" : gris ? "off" : "wait"}"></i>${esc(s.nombre.replace(/ \(.*\)/, ""))}`, {g: p, y: 1.95}, () => abrir("estrategia", s));
    });
  }
  const et = k => d.laboratorio.filter(s => s.etapa === k);
  // Backtest: pizarrones + gente probando
  caja(3, 1.6, .1, "#f8f6f0", -16, .8, -13.8); caja(3, 1.6, .1, "#f8f6f0", -11.5, .8, -13.8);
  escritorio(-17, -10.5, "#e9e2d6", "#7aa2ff"); escritorio(-13, -10.5, "#e9e2d6", "#7aa2ff");
  sembrar(et("cola").concat(et("reserva"), et("backtest")), -19.5, -7.5, -8.5, -2.5, false);
  // descartados: banca gris en la esquina
  caja(4, .45, .8, "#5a5466", -17.6, 0, -12.6);
  sembrar(et("rechazada").slice(0, 4), -19.6, -15.4, -13.4, -12.2, true);
